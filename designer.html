<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Designer — Bet House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Oswald:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="index.html">Bet House</a></div>
    <button id="to-lobby" class="ghost hidden" type="button">Lobby</button>
  </div>
  <main class="shell wide">
    <section id="lobby" class="gate">
      <h1>Designer</h1>
      <div class="row"><input id="pin" inputmode="numeric" maxlength="4" placeholder="Pin"></div>
      <p id="lobby-note" class="note"></p>
    </section>
    <section id="desk" class="hidden">
      <div class="subtabs">
        <button type="button" id="view-table" class="active">Both houses</button>
        <button type="button" id="view-qr">Player QR</button>
      </div>
      <section id="table-view">
        <p class="reset-row">
          <span class="tumbler">Bets <button type="button" id="lock-bets" class="switch"><span>Unlock</span><i class="knob"></i><span>Lock</span></button></span>
          <span class="tumbler">Weights <button type="button" id="lock-weights" class="switch"><span>Unlock</span><i class="knob"></i><span>Lock</span></button></span>
          <span class="tumbler">Publish <button type="button" id="publish-switch" class="switch"><span>Off</span><i class="knob"></i><span>On</span></button></span>
          <button type="button" id="reset-players" class="reset-btn">Reset</button>
        </p>
        <div class="table-wrap">
          <table>
            <thead><tr id="head-house"></tr><tr id="head-labels"></tr><tr id="head-coefs"></tr></thead>
            <tbody id="body"></tbody>
            <tfoot><tr id="foot"></tr></tfoot>
          </table>
        </div>
      </section>
      <section id="qr-view" class="qr-wrap hidden">
        <div id="qr-holder"></div>
        <p class="qr-url" id="qr-url"></p>
      </section>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="js/qrcode.min.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/designer.js"></script>
</body>
</html>
