<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Master — Bet House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Oswald:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="index.html">Bet House</a></div>
    <button id="to-lobby" class="ghost hidden" type="button">Lobby</button>
  </div>
  <main class="shell wide">
    <section id="lobby" class="gate">
      <h1>Master</h1>
      <div class="lobby-icons">
        <button type="button" id="pick-orange" class="pick orange"><img src="icons/orange.png" alt="Orange"><div>Orange</div></button>
        <button type="button" id="pick-red" class="pick red"><img src="icons/red.png" alt="Red"><div>Red</div></button>
      </div>
      <div class="row"><input id="pin" inputmode="numeric" maxlength="3" placeholder="Pin"></div>
      <p id="lobby-note" class="note">Choose a house, then enter its pin. A saved visit opens the last house; Lobby starts again.</p>
    </section>
    <section id="desk" class="hidden">
      <div class="market-tabs">
        <button type="button" id="tab-orange">Orange</button>
        <button type="button" id="tab-red">Red</button>
      </div>
      <div id="identity" class="identity orange"></div>
      <div class="status-line">
        <span id="status-label"></span>
        <button type="button" id="regime" class="toggle">Weights</button>
      </div>
      <div class="subtabs">
        <button type="button" id="view-weights" class="active">Weights</button>
        <button type="button" id="view-book">Participants</button>
      </div>
      <section id="weights">
        <div class="profit-line">
          <label for="profit">Target profit</label>
          <input id="profit" class="profit-input" inputmode="decimal" value="5">
          <span>%</span>
          <span id="profit-warn" class="warn"></span>
        </div>
        <div id="board" class="board"></div>
      </section>
      <section id="book" class="hidden">
        <p class="reset-row">
          <button type="button" id="publish" class="reset-btn">Publish</button>
          <button type="button" id="reset-players" class="reset-btn">Reset</button>
        </p>
        <div class="table-wrap">
          <table>
            <thead><tr id="head-labels"></tr><tr id="head-coefs"></tr></thead>
            <tbody id="book-body"></tbody>
            <tfoot><tr id="book-foot"></tr></tfoot>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/master.js"></script>
</body>
</html>
