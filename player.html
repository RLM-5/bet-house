<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Player — Bet House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Oswald:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="index.html">Bet House</a></div>
    <button id="to-lobby" class="ghost hidden" type="button">Lobby</button>
    <div id="mode" class="mode-pill">…</div>
  </div>
  <main class="shell">
    <section id="gate" class="gate">
      <h1>Enter</h1>
      <div class="row"><input id="name" maxlength="24" autocomplete="off" placeholder="Name"></div>
      <div class="row" style="margin-top:8px"><input id="pin" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Pin"><button id="proceed" class="primary" type="button">Proceed</button></div>
      <p id="gate-note" class="note"></p>
    </section>
    <section id="bet" class="hidden">
      <div class="wallet"><span>Available</span><b id="available">100</b><span class="mp"><span>MP</span></span></div>
      <button id="place" class="primary bet-btn" type="button">Place your Bet</button>
      <div class="market-tabs">
        <button type="button" id="tab-orange">Orange</button>
        <button type="button" id="tab-red">Red</button>
      </div>
      <div id="identity" class="identity orange"></div>
      <p id="regime" class="note"></p>
      <div id="board" class="board"></div>
    </section>
    <section id="result" class="outro hidden">
      <h1>Result</h1>
      <p id="result-lead"></p>
      <div id="result-body"></div>
      <button id="bet-again" class="primary bet-btn" type="button">Bet again</button>
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden">
    <div class="sheet">
      <p id="modal-text"></p>
      <div class="actions">
        <button type="button" id="bet-more" class="ghost">Bet more</button>
        <button type="button" id="confirm-yes" class="primary">Yes</button>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
